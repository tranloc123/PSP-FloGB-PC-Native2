<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font-family:Segoe UI,Arial;color:white;overflow:hidden;user-select:none}.wrap{position:relative;width:100vw;height:100vh}.team{position:absolute;top:22px;width:300px;background:linear-gradient(180deg,rgba(10,16,28,.90),rgba(12,20,35,.74));border:1px solid rgba(238,201,104,.6);border-radius:16px;padding:12px 14px;box-shadow:0 10px 35px #0008}.p1{left:20px}.p2{right:20px}.title{font-size:18px;color:#f1d37a;font-weight:800;margin-bottom:8px;text-align:center}.row{display:grid;grid-template-columns:32px 1fr auto;gap:8px;padding:5px 8px;border-radius:8px;background:#ffffff0a;margin-top:4px;font-size:12px}.row b{color:#f5d77f}.winner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.96);min-width:520px;text-align:center;padding:24px 34px;border-radius:22px;background:radial-gradient(circle at top,#223654ee,#0b101bd9 70%);border:2px solid #e7c66a;box-shadow:0 0 55px #d7ae4766;opacity:0;transition:.22s}.winner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.winner h1{margin:0;color:#ffe18b;font-size:34px}.winner .sub{margin-top:10px;color:#cdd9e8;font-size:18px}.winner .pick{margin-top:14px;color:#fff;font-weight:800;font-size:22px}.hp{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#0a1018cc;border:1px solid #ffffff22;border-radius:12px;padding:10px 18px;font-weight:700}.hp span{margin:0 16px}.hp b{color:#f5d77f}.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#05080db8;border:1px solid #ffffff18;border-radius:999px;padding:5px 12px;font-size:11px;color:#c6d0df}.menuBackdrop{display:none;position:absolute;inset:0;background:#0007;pointer-events:auto}.menuBackdrop.show{display:block}.menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,88vw);background:linear-gradient(180deg,#101827f2,#090e18f2);border:1px solid #d6b65f;border-radius:18px;box-shadow:0 24px 80px #000c;padding:18px}.menuHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26344a;padding-bottom:12px;margin-bottom:14px}.menuHead h2{margin:0;color:#f0cf72}.menuHead button{background:#39212a;border:1px solid #7b3344;color:#fff;border-radius:8px;padding:8px 12px}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.tile{background:#111c2b;border:1px solid #26364d;border-radius:10px;padding:10px}.tile small{display:block;color:#8292a8}.tile b{display:block;margin-top:4px;color:#f4d77f}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.controls button{padding:11px 8px;border-radius:9px;background:#17243a;color:#fff;border:1px solid #314869;font-weight:700}.controls button.gold{background:#c9a34c;color:#111;border-color:#e2c36f}.controls button.red{background:#4a1d28;border-color:#7b3243}.foot{margin-top:12px;font-size:11px;color:#8292a8;text-align:center}
</style></head><body><div class="wrap"><div class="hint">F10: MENU FLOGB</div><div class="team p1"><div class="title">P1 TOP 10</div><div id="p1"></div></div><div class="team p2"><div class="title">P2 TOP 10</div><div id="p2"></div></div><div class="winner" id="winner"><h1 id="wt">WINNER</h1><div class="sub" id="ws"></div><div class="pick" id="wp"></div></div><div class="hp"><span>P1 <b id="hp1">-</b></span><span>P2 <b id="hp2">-</b></span></div><div class="menuBackdrop" id="menuBackdrop"><div class="menu"><div class="menuHead"><h2>PSP FloGB • Game Menu</h2><button id="closeMenu">ĐÓNG F10</button></div><div class="status"><div class="tile"><small>PPSSPP</small><b id="mPP">OFF</b></div><div class="tile"><small>PHASE</small><b id="mPhase">-</b></div><div class="tile"><small>MODE</small><b id="mMode">-</b></div><div class="tile"><small>PATCH</small><b id="mPatch">OFF</b></div></div><div class="controls"><button data-tap="start" class="gold">START</button><button data-tap="cross">X / CROSS</button><button data-tap="left">LEFT</button><button data-tap="right">RIGHT</button><button data-tap="up">UP</button><button data-tap="down">DOWN</button><button id="winnerP1">TEST WIN P1</button><button id="winnerP2">TEST WIN P2</button><button id="resetSession" class="red">RESET PHIÊN</button></div><div class="foot">Gift chưa Add Rule sẽ không tác động game. Combat Core giữ anti-heal, KO thật, outro, winner/pick và BXH theo baseline APK.</div></div></div></div><script>
const{ipcRenderer}=require('electron');const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function rows(a){return(a||[]).slice(0,10).map((r,i)=>`<div class="row"><b>#${i+1}</b><span>${esc(r.displayName||r.uniqueId||'viewer')}</span><b>${Number(r.score||0).toLocaleString()}</b></div>`).join('')}let lastState=null;ipcRenderer.on('controller-state',(_,s)=>{lastState=s;const ses=s?.session||{},p=s?.ppsspp||{};document.getElementById('p1').innerHTML=rows(ses.leaderboardP1);document.getElementById('p2').innerHTML=rows(ses.leaderboardP2);document.getElementById('hp1').textContent=p.p1HP??'-';document.getElementById('hp2').textContent=p.p2HP??'-';document.getElementById('mPP').textContent=p.connected?'CONNECTED':'OFF';document.getElementById('mPhase').textContent=p.gamePhase||'-';document.getElementById('mMode').textContent=p.mode??'-';document.getElementById('mPatch').textContent=p.patchesApplied?'ON':'OFF';const a=ses.activePick,w=document.getElementById('winner');if(a){w.classList.add('show');document.getElementById('wt').textContent=`${a.winnerTeam} WINNER`;document.getElementById('ws').textContent=`TOP1: ${a.top1Name||'-'} • hỗ trợ ${Number(a.top1Score||0).toLocaleString()}`;document.getElementById('wp').textContent=a.locked?(a.timedOut?'TIMEOUT → RANDOM':`LOCKED /pick ${a.pick||'-'}`):'15 GIÂY: /pick 1..28';}else w.classList.remove('show')});ipcRenderer.on('overlay-menu',(_,open)=>document.getElementById('menuBackdrop').classList.toggle('show',!!open));document.getElementById('closeMenu').onclick=()=>ipcRenderer.invoke('set-overlay-menu',false);document.querySelectorAll('[data-tap]').forEach(b=>b.onclick=()=>ipcRenderer.invoke('ppsspp-tap',b.dataset.tap));document.getElementById('winnerP1').onclick=()=>ipcRenderer.invoke('manual-winner','P1');document.getElementById('winnerP2').onclick=()=>ipcRenderer.invoke('manual-winner','P2');document.getElementById('resetSession').onclick=()=>ipcRenderer.invoke('reset-session');
</script></body></html>
